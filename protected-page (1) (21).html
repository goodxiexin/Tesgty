<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Protected Page</title>
<style>
body.pc-login-mode{font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f1f5f9;margin:0}
#pc-login{background:white;padding:2.5rem 2rem;border-radius:20px;box-shadow:0 20px 40px -10px rgba(0,0,0,0.1);text-align:center;width:90%;max-width:360px;position:relative;overflow:hidden}
#pc-login input{padding:14px;width:100%;margin:12px 0;border:1px solid #e2e8f0;border-radius:10px;box-sizing:border-box;font-size:16px;transition:0.2s}
#pc-login input:focus{border-color:#2563eb;outline:none;box-shadow:0 0 0 3px #2563eb20}
#pc-login button{padding:14px;width:100%;background:#2563eb;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;transition:0.2s}
#pc-login button:active{transform:scale(0.98)}
.msg{color:#ef4444;font-size:14px;margin-top:12px;min-height:20px;opacity:0;transition:opacity 0.3s}
.msg.show{opacity:1}
.timer-wrap{margin-top:15px;display:none}
.timer-bar{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin-top:8px}
.timer-fill{height:100%;background:#2563eb;width:100%;transition:width 1s linear}
.timer-text{color:#64748b;font-size:13px}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake 0.4s ease-in-out}
@keyframes pulse{0%{opacity:1}50%{opacity:0.6}100%{opacity:1}}
.loading{animation:pulse 1.5s infinite;pointer-events:none}
.ban-msg{color:#dc2626;font-weight:700;font-size:1.1rem;margin-top:20px}
</style></head><body class="pc-login-mode">

const DELAYS=[3000,6000,12000,30000,60000,300000];
let isLocked=false, lockEndTime=0, currentAttempts=0, timerRAF=null;

// HYBRID PERSISTENCE: SessionStorage (Sync) + IndexedDB (Async Backup)
function getStoredState(){
    try{
        const ss=sessionStorage.getItem('pc_lock');
        if(ss){
            const parsed=JSON.parse(ss);
            if(parsed.unlockTime > Date.now()) return parsed;
        }
    }catch(e){}
    
    // Fallback ke localStorage jika sessionStorage diblokir
    try{
        const ls=localStorage.getItem('pc_lock');
        if(ls){
            const parsed=JSON.parse(ls);
            if(parsed.unlockTime > Date.now()) return parsed;
        }
    }catch(e){}
    
    return {attempts:0, unlockTime:0};
}

function saveStoredState(data){
    try{sessionStorage.setItem('pc_lock', JSON.stringify(data));}catch(e){}
    try{localStorage.setItem('pc_lock', JSON.stringify(data));}catch(e){}
}

function applyLockUI(delay){
    const inp=document.getElementById('p');
    const btn=document.getElementById('btn');
    const tw=document.getElementById('tw');
    
    // HARD LOCK: Hapus elemen input dari DOM agar tidak bisa diakses sama sekali
    if(inp && inp.parentNode) inp.parentNode.removeChild(inp);
    if(btn && btn.parentNode) btn.parentNode.removeChild(btn);
    
    tw.style.display='block';
    tw.dataset.total=delay;
    isLocked=true;
    startTimer(delay);
}

function startTimer(totalDelay){
    if(timerRAF) cancelAnimationFrame(timerRAF);
    const endTime=Date.now()+totalDelay;
    lockEndTime=endTime;
    
    function tick(){
        if(!isLocked) return;
        const rem=Math.max(0, endTime-Date.now());
        const tt=document.getElementById('tt');
        const tf=document.getElementById('tf');
        
        if(rem<=0){
            releaseLock();
            return;
        }
        
        if(tt) tt.innerText=Math.ceil(rem/1000)+' detik tersisa';
        if(tf) tf.style.width=(rem/totalDelay*100)+'%';
        
        timerRAF=requestAnimationFrame(tick);
    }
    tick();
}

function releaseLock(){
    isLocked=false;
    currentAttempts=0;
    saveStoredState({attempts:0, unlockTime:0});
    
    const tw=document.getElementById('tw');
    if(tw) tw.style.display='none';
    
    // Restore UI elements
    const loginBox=document.getElementById('pc-login');
    const msg=document.getElementById('m');
    
    const newInp=document.createElement('input');
    newInp.type='password'; newInp.id='p'; newInp.placeholder='Password...'; newInp.autocomplete='off';
    
    const newBtn=document.createElement('button');
    newBtn.id='btn'; newBtn.innerText='Buka Halaman'; newBtn.onclick=tryOpen;
    
    // Insert before timer wrap or ban container
    if(tw && tw.parentNode) tw.parentNode.insertBefore(newInp, tw);
    if(tw && tw.parentNode) tw.parentNode.insertBefore(newBtn, tw);
    
    if(msg) msg.classList.remove('show');
}

        const dk=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:50000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
        const dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},dk,data);
        
        // SUKSES
        const finalHtml=new TextDecoder().decode(dec);
        const parser=new DOMParser();
        const doc=parser.parseFromString(finalHtml,'text/html');
        document.documentElement.innerHTML=doc.documentElement.innerHTML;
        setTimeout(()=>{
            document.querySelectorAll('script').forEach(os=>{
                const ns=document.createElement('script');
                Array.from(os.attributes).forEach(a=>ns.setAttribute(a.name,a.value));
                if(!os.src)ns.text=os.textContent;
                os.parentNode.replaceChild(ns,os);
            });
        },50);
        
    }catch(e){
        // GAGAL: Hitung delay berdasarkan attempt lokal
        const delayIndex=Math.min(currentAttempts, DELAYS.length-1);
        const delay=DELAYS[delayIndex];
        currentAttempts++;
        
        // Simpan state secara sinkron
        saveStoredState({attempts:currentAttempts, unlockTime:Date.now()+delay});
        
        if(currentAttempts>=DELAYS.length+2){
            showBan();
            return;
        }
        
        const msg=document.getElementById('m');
        if(msg){
            msg.innerText="Verifikasi gagal. Tunggu "+Math.ceil(delay/1000)+"s";
            msg.classList.add('show');
        }
        card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
        
        applyLockUI(delay);
        
    }finally{
        // Cleanup tombol loading jika tidak masuk mode lock
        if(!isLocked){
            const b=document.getElementById('btn');
            if(b){b.classList.remove('loading');b.innerText="Buka Halaman";b.disabled=false;}
            const i=document.getElementById('p');
            if(i) i.disabled=false;
        }
    }
}

function showBan(){
    isLocked=true;
    const inp=document.getElementById('p'); if(inp) inp.remove();
    const btn=document.getElementById('btn'); if(btn) btn.remove();
    const m=document.getElementById('m'); if(m) m.remove();
    const tw=document.getElementById('tw'); if(tw) tw.remove();
    document.getElementById('banContainer').style.display='block';
}

// Init check
(function(){
    const state=getStoredState();
    currentAttempts=state.attempts;
    if(state.unlockTime > Date.now()){
        const remaining=state.unlockTime-Date.now();
        applyLockUI(remaining);
    }
})();
</script></body></html>
