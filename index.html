<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosting HTML Gratis - Cloudflare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .icon-big {
            font-size: 72px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .drop-zone {
            border: 3px dashed #cbd5e1;
            border-radius: 16px;
            padding: 40px 20px;
            background: #f8fafc;
            transition: all 0.3s;
            cursor: pointer;
        }

        .drop-zone:hover {
            border-color: #667eea;
            background: #f1f5ff;
        }

        .drop-zone.dragover {
            border-color: #667eea;
            background: #e8edff;
        }

        .drop-zone .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .drop-zone p {
            color: #475569;
            font-size: 15px;
        }

        .drop-zone .or {
            color: #94a3b8;
            margin: 12px 0;
            font-size: 14px;
        }

        .btn-select {
            background: #e2e8f0;
            border: none;
            padding: 10px 30px;
            border-radius: 10px;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-select:hover {
            background: #cbd5e1;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 16px;
            padding: 12px 16px;
            background: #dcfce7;
            border-radius: 10px;
            display: none;
            color: #166534;
            font-weight: 500;
            font-size: 14px;
        }

        .file-info.show {
            display: block;
        }

        .btn-publish {
            width: 100%;
            margin-top: 24px;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-publish:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
            white-space: pre-line;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
        }

        .status.loading {
            display: block;
            background: #e0f2fe;
            color: #075985;
        }

        .footer {
            margin-top: 24px;
            color: #94a3b8;
            font-size: 13px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-big">🚀</div>
    <h1>Hosting HTML Gratis</h1>
    <p class="subtitle">Upload & deploy website statismu dalam hitungan detik</p>

    <!-- Drop Zone -->
    <div class="drop-zone" id="dropZone">
        <div class="icon">📁</div>
        <p><strong>Seret file (.html) ke sini</strong></p>
        <div class="or">atau</div>
        <button class="btn-select" onclick="document.getElementById('fileInput').click()">Pilih File</button>
        <input type="file" id="fileInput" accept=".html,.htm" multiple>
    </div>

    <!-- File Info -->
    <div class="file-info" id="fileInfo">
        ✅ <span id="fileCount">0</span> file siap diupload
    </div>

    <!-- Status -->
    <div class="status" id="status"></div>

    <!-- Publish Button -->
    <button class="btn-publish" id="btnPublish">🌐 Terbitkan Halaman</button>

    <div class="footer">
        Powered by <a href="https://pages.cloudflare.com" target="_blank">Cloudflare Pages</a> · 100% Gratis
    </div>
</div>

<script>
    // ============================================
    // 1. GANTI DENGAN KREDENSIAL CLOUDFLARE-MU
    // ============================================
    const ACCOUNT_ID = '40825f4a767666ce2a90c4d7aa67a161';   // Ganti ini
    const API_TOKEN = 'cfut_y5tj8YG3atRuOBlNnFApw4IYdcGNfJjmqvKvEtrh233376da';     // Ganti ini

    // ============================================
    // 2. KODE UTAMA (Jangan diubah)
    // ============================================
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileCount = document.getElementById('fileCount');
    const status = document.getElementById('status');
    const btnPublish = document.getElementById('btnPublish');

    let selectedFiles = [];

    // Drag & Drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    dropZone.addEventListener('click', (e) => {
        if (e.target === dropZone || e.target.closest('.drop-zone') && !e.target.closest('button')) {
            fileInput.click();
        }
    });

    function handleFiles(files) {
        const htmlFiles = Array.from(files).filter(f => 
            f.name.endsWith('.html') || f.name.endsWith('.htm')
        );

        if (htmlFiles.length === 0) {
            showStatus('error', '⚠️ Pilih file HTML (.html atau .htm)');
            return;
        }

        selectedFiles = htmlFiles;
        fileCount.textContent = selectedFiles.length;
        fileInfo.classList.add('show');
        showStatus('success', `✅ ${selectedFiles.length} file HTML siap deploy!`);
        btnPublish.disabled = false;
    }

    function showStatus(type, msg) {
        status.className = 'status ' + type;
        status.textContent = msg;
    }

    // Tombol Terbitkan
    btnPublish.addEventListener('click', async function() {
        if (selectedFiles.length === 0) {
            showStatus('error', '⚠️ Upload file HTML dulu!');
            return;
        }

        // Cek kredensial
        if (ACCOUNT_ID === 'YOUR_ACCOUNT_ID' || API_TOKEN === 'YOUR_API_TOKEN') {
            showStatus('error', '⚠️ Ganti dulu ACCOUNT_ID dan API_TOKEN di kode!');
            return;
        }

        const projectName = 'my-site-' + Math.random().toString(36).substring(2, 8);
        const deployUrl = `https://${projectName}.pages.dev`;

        showStatus('loading', `⏳ Deploy ke Cloudflare...\nProject: ${projectName}`);
        btnPublish.disabled = true;
        btnPublish.textContent = '⏳ Memproses...';

        try {
            // STEP 1: Buat project
            const createRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: projectName,
                    production_branch: 'main'
                })
            });

            if (!createRes.ok) {
                const err = await createRes.json();
                // Kode error 8000012 = project sudah ada (abaikan)
                if (err.errors?.[0]?.code !== 8000012) {
                    throw new Error(`Gagal buat project: ${err.errors?.[0]?.message || 'Unknown error'}`);
                }
            }

            // STEP 2: Upload file
            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('file', file);
            });

            const uploadRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/pages/projects/${projectName}/deployments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_TOKEN}`
                },
                body: formData
            });

            if (!uploadRes.ok) {
                const err = await uploadRes.json();
                throw new Error(`Gagal upload: ${err.errors?.[0]?.message || 'Unknown error'}`);
            }

            // STEP 3: Sukses!
            showStatus('success', `🎉 BERHASIL! Website online di:\n${deployUrl}\n\n✨ Bisa dibuka semua orang!`);
            btnPublish.disabled = false;
            btnPublish.textContent = '🌐 Terbitkan Halaman';

            // Reset setelah 15 detik
            setTimeout(() => {
                selectedFiles = [];
                fileInfo.classList.remove('show');
                status.className = 'status';
                status.textContent = '';
            }, 15000);

        } catch (error) {
            showStatus('error', '❌ Gagal deploy: ' + error.message);
            btnPublish.disabled = false;
            btnPublish.textContent = '🌐 Terbitkan Halaman';
        }
    });
</script>

</body>
</html>
